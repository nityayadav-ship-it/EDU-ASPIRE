<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — EDU-ASPIRE</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">EDU-ASPIRE</a><nav id="nav"></nav></header>
<main class="container"><div class="page-head"><div><span class="badge">Dashboard</span><h1 id="welcome">Welcome</h1><p id="roleText"></p></div><button id="logout" class="btn secondary">Logout</button></div>

<section>
  <h2>My Learning Overview</h2>
  <div class="grid three">
    <article class="card">
      <h3>Available Courses</h3>
      <p id="availableCount">Loading...</p>
    </article>
    <article class="card">
      <h3>Bookmarked Courses</h3>
      <p id="bookmarkCount">Loading...</p>
    </article>
    <article class="card">
      <h3>Courses In Progress</h3>
      <p id="progressCount">Loading...</p>
    </article>
  </div>
</section>

<section>
  <h2>Continue Learning</h2>
  <div id="myLearning" class="grid three"></div>
</section>

<section>
  <h2>Available Courses</h2>
  <div id="courses" class="grid three"></div>
</section>

<section><h2>My Bookmarks</h2><div id="bookmarks" class="grid three"></div></section>
</main><footer>EDU-ASPIRE Cloud LMS</footer><script type="module" src="js/dashboard.js"></script></body></html>
